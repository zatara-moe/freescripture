<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="paperGlow" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#fffaef" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f4ecd8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e3d4ad" stop-opacity="1"/>
    </radialGradient>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.165
                             0 0 0 0 0.122
                             0 0 0 0 0.082
                             0 0 0 0.06 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Parchment background -->
  <rect width="1200" height="630" fill="url(#paperGlow)"/>
  <rect width="1200" height="630" fill="#000" filter="url(#paperNoise)" opacity="0.4"/>

  <!-- Top tradition stripe (Christian gold accent) -->
  <rect x="0" y="0" width="1200" height="6" fill="#8B6914"/>

  <!-- Eyebrow -->
  <text x="600" y="135" text-anchor="middle"
        font-family="DM Mono, monospace" font-size="20" letter-spacing="6"
        fill="#7a6648">A HOPE FOR AMERICANS PROJECT</text>

  <!-- Site mark -->
  <text x="600" y="260" text-anchor="middle"
        font-family="Cormorant Garamond, EB Garamond, Georgia, serif"
        font-style="italic" font-weight="500" font-size="92"
        fill="#2a1f15">Free Scripture</text>

  <!-- Decorative rule -->
  <line x1="540" y1="295" x2="660" y2="295" stroke="#c9b88a" stroke-width="1"/>

  <!-- Tagline -->
  <text x="600" y="365" text-anchor="middle"
        font-family="Crimson Pro, Georgia, serif" font-size="32"
        fill="#4a3a28">A free library of scripture, beautifully presented</text>

  <!-- Sub-tagline / what's in it -->
  <text x="600" y="415" text-anchor="middle"
        font-family="Crimson Pro, Georgia, serif" font-style="italic" font-size="22"
        fill="#7a6648">King James Bible &#183; Apocrypha &#183; 80 books, 36,923 verses</text>

  <!-- Trust signals -->
  <g font-family="DM Mono, monospace" font-size="16" letter-spacing="3" fill="#7a6648">
    <text x="380" y="525" text-anchor="middle">FREE FOREVER</text>
    <text x="540" y="525" text-anchor="middle">&#183;</text>
    <text x="600" y="525" text-anchor="middle">NO ADS</text>
    <text x="660" y="525" text-anchor="middle">&#183;</text>
    <text x="820" y="525" text-anchor="middle">NO ACCOUNT NEEDED</text>
  </g>

  <!-- Made-with line -->
  <text x="600" y="585" text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-size="20"
        fill="#7a6648">Made with &#9829; in Flagstaff, Arizona at 7,000 feet</text>

  <!-- Domain bottom-right -->
  <text x="1140" y="600" text-anchor="end"
        font-family="DM Mono, monospace" font-size="14" letter-spacing="2"
        fill="#7a6648">freescripture.org</text>
</svg>
