<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Parchment background -->
  <rect width="64" height="64" rx="10" fill="#f4ecd8"/>

  <!-- Subtle inner highlight -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="none" stroke="#e3d4ad" stroke-width="0.6"/>

  <!-- Open book — two facing pages with a center crease -->
  <!-- Left page -->
  <path d="M 14 18 Q 14 14 18 14 L 31 14 Q 32 14 32 16 L 32 50 Q 32 52 30 51 Q 22 48 14 50 Z"
        fill="none" stroke="#2a1f15" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right page -->
  <path d="M 50 18 Q 50 14 46 14 L 33 14 Q 32 14 32 16 L 32 50 Q 32 52 34 51 Q 42 48 50 50 Z"
        fill="none" stroke="#2a1f15" stroke-width="2" stroke-linejoin="round"/>

  <!-- Three subtle text lines per page in warm gold (the Christian accent) -->
  <line x1="18" y1="22" x2="29" y2="22" stroke="#8B6914" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="18" y1="27" x2="28" y2="27" stroke="#8B6914" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="18" y1="32" x2="29" y2="32" stroke="#8B6914" stroke-width="1.3" stroke-linecap="round"/>

  <line x1="35" y1="22" x2="46" y2="22" stroke="#8B6914" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="35" y1="27" x2="45" y2="27" stroke="#8B6914" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="35" y1="32" x2="46" y2="32" stroke="#8B6914" stroke-width="1.3" stroke-linecap="round"/>
</svg>
